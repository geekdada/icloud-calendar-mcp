name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The server itself is tested in rust.yml. This job covers what sits outside
# rust/: version consistency and the npm/PyPI wrappers.
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version consistency
        run: bash scripts/check-version.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test npm wrapper
        working-directory: npm-package
        run: npm test

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Test Python wrapper
        working-directory: py-package
        run: uv run --frozen python -m unittest discover -s tests -v
