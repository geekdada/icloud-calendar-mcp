name: Release

on:
  push:
    tags:
      - 'v*'
  # Build every target on PRs that change the release build, so a broken matrix
  # shows up before a tag does. Only tag pushes publish anything.
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'rust/.cargo/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify version and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches project version
        # The npm package downloads binaries from the release named after its own
        # version, so a tag that differs from rust/Cargo.toml would 404 downstream.
        # scripts/bump-version.sh keeps them aligned.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -n 1)"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match rust/Cargo.toml version $CARGO_VERSION. Run scripts/bump-version.sh $TAG_VERSION, commit, then re-tag."
            exit 1
          fi

      - name: Check version consistency
        run: bash scripts/check-version.sh

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Run tests
        working-directory: rust
        run: cargo test --locked

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            smoke: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            smoke: true
          - target: x86_64-apple-darwin
            os: macos-latest
            # Cross-compiled on an Apple silicon runner, so it is not run here.
            smoke: false
          - target: aarch64-apple-darwin
            os: macos-latest
            smoke: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            smoke: true
            ext: .exe
    defaults:
      run:
        shell: bash
    env:
      ASSET: icloud-calendar-mcp-${{ matrix.target }}${{ matrix.ext }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      - name: Build
        working-directory: rust
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage binary
        run: |
          mkdir -p dist
          cp "rust/target/${{ matrix.target }}/release/icloud-calendar-mcp${{ matrix.ext }}" "dist/$ASSET"
          ls -l dist

      - name: Verify static linking
        if: contains(matrix.target, 'musl')
        run: |
          file "dist/$ASSET"
          file "dist/$ASSET" | grep -Eq 'statically linked|static-pie linked'

      - name: Smoke test
        # The server answers initialize and exits when stdin closes.
        if: matrix.smoke
        timeout-minutes: 2
        run: |
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"release-smoke","version":"1"}}}'
          response="$(echo "$request" | "dist/$ASSET")"
          echo "$response"
          echo "$response" | grep -q '"serverInfo":{"name":"icloud-calendar-mcp"'

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/${{ env.ASSET }}
          if-no-files-found: error

  checksums:
    name: Checksums
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum icloud-calendar-mcp-* > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 5

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: checksums
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download binaries and checksums
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-npm:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      id-token: write  # npm provenance
    environment:
      name: npm
      url: https://www.npmjs.com/package/@royli/icloud-calendar-mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        # Node 24 ships with npm 11.x, which supports OIDC trusted publishing.
        # Older Node + `npm install -g npm@latest` self-upgrade hits
        # MODULE_NOT_FOUND issues on the runner, so we let setup-node pull a
        # Node version where the bundled npm is already new enough.
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update package version
        working-directory: npm-package
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Bundle SHA256SUMS
        # The installer verifies the downloaded binary against this file.
        uses: actions/download-artifact@v4
        with:
          name: checksums
          path: npm-package/lib

      - name: Verify package contents
        working-directory: npm-package
        run: |
          npm test
          npm pack --dry-run --ignore-scripts 2>&1 | tee pack.log
          grep -q 'lib/SHA256SUMS' pack.log

      - name: Stage on npm
        # NPM_TOKEN is a granular access token with "Read and write (stage only)"
        # on the @royli scope, so CI can stage a version but never publish one.
        # The version stays hidden until a maintainer approves it with 2FA.
        # Staging needs npm 11.15+, which Node 24 bundles. Provenance is signed
        # with the job's OIDC token. A prerelease goes to the next dist-tag so
        # it never becomes latest.
        working-directory: npm-package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The NPM_TOKEN secret is not set. Add it to the npm environment or the repository secrets."
            exit 1
          fi
          case "$VERSION" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          npm stage publish --access public --provenance --tag "$dist_tag"
          {
            echo "### @royli/icloud-calendar-mcp@$VERSION is staged"
            echo ""
            echo "Approve it to publish under the \`$dist_tag\` tag: run \`npm stage list @royli/icloud-calendar-mcp\`, then \`npm stage approve <stage-id>\`, or use the stage queue on npmjs.com."
          } >> "$GITHUB_STEP_SUMMARY"
